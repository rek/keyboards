# --- Lily58 / nice!nano v2 config: wired split over TRRS, no Bluetooth ---

# Bluetooth fully off (2026-10-07). Halves talk over the TRRS cable (UART,
# see lily58_left/right.overlay), the left talks to the PC over USB.
CONFIG_ZMK_BLE=n

# Deep sleep after idle to save battery (wakes on keypress).
CONFIG_ZMK_SLEEP=y
# Idle time (ms) before entering deep sleep — 30 min.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Wired split UART in interrupt mode. ZMK's own Kconfig warns that async/DMA
# mode has an RX bug on nRF52, but picks async anyway when the SoC supports it.
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y

# Uncomment for an OLED display (needs R1/R2 I2C pull-ups populated on the PCB):
# CONFIG_ZMK_DISPLAY=y

# Matrix debugging (only if needed): build with `-S zmk-usb-logging`; ZMK's log
# level already defaults to debug, so each key prints its row/col over USB serial.
# Do NOT set CONFIG_LOG_DEFAULT_LEVEL=4 globally — it hangs USB enumeration.

# --- Lily58 / nice!nano v2 (wireless) config ---

# Deep sleep after idle to save battery (wakes on keypress).
CONFIG_ZMK_SLEEP=y
# Idle time (ms) before entering deep sleep — 30 min.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery level reporting over BLE (nice!nano has battery sensing).
CONFIG_ZMK_BATTERY_REPORTING=y

# Bluetooth is the default output on nice!nano; nothing extra needed.
# Uncomment to make USB the preferred output when plugged in:
# CONFIG_ZMK_USB=y

# Uncomment for an OLED display (needs R1/R2 I2C pull-ups populated on the PCB):
# CONFIG_ZMK_DISPLAY=y

# Matrix debugging (only if needed): build with `-S zmk-usb-logging`; ZMK's log
# level already defaults to debug, so each key prints its row/col over USB serial.
# Do NOT set CONFIG_LOG_DEFAULT_LEVEL=4 globally — it hangs USB enumeration.

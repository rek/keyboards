# Central fetches the peripheral's battery level over the split link and
# proxies it to the host as a second BLE battery service instance, so the
# desktop can show BOTH halves' battery percentages.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ZMK Studio: live keymap inspection/editing over USB. Only the central (left)
# half speaks the Studio RPC protocol; it also needs the studio-rpc-usb-uart
# snippet in build.yaml. Without BOTH, the &studio_unlock bind is a no-op.
CONFIG_ZMK_STUDIO=y

# No Bluetooth to the host: the left half talks to the PC over USB only.
# ZMK can't switch host BLE off on a BLE split (ZMK_SPLIT_BLE depends on
# ZMK_BLE), so instead cap the radio at ONE live connection. The right half
# takes it; a host can't connect, so output never jumps to a dead BLE link.
# Keep BT_MAX_PAIRED at its default (6): setting it to 1 makes
# ZMK_BLE_PROFILE_COUNT = 0 and ble.c indexes an empty profiles[] array.
# Catch: if a host grabs the slot before the right half links (only possible
# if a host actively pairs at boot), the right half is dead until a reset.
CONFIG_BT_MAX_CONN=1

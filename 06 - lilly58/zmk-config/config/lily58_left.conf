# Central fetches the peripheral's battery level over the split link and
# proxies it to the host as a second BLE battery service instance, so the
# desktop can show BOTH halves' battery percentages.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ZMK Studio: live keymap inspection/editing over USB. Only the central (left)
# half speaks the Studio RPC protocol; it also needs the studio-rpc-usb-uart
# snippet in build.yaml. Without BOTH, the &studio_unlock bind is a no-op.
CONFIG_ZMK_STUDIO=y
